<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML/CSS Quiz</title>
    <meta name="description" content="Quiz form for WDD 130 course">
    <meta name="author" content="Jerrymac Adams Oluoch">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Question 1</legend>
                <label for="q1">What does CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </fieldset>

            <fieldset>
                <legend>Question 2</legend>
                <label for="q2">Explain the difference between id and class.</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </fieldset>

            <fieldset>
                <legend>Question 3</legend>
                <label for="q3">What is a valid CSS comment?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose one ...</option>
                    <option value="//">// comment</option>
                    <option value="/*">/* comment */</option>
                    <option value="<!--"><!-- comment --></option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Question 4</legend>
                <label for="q4">What is the bottom margin in this declaration?<br>
                    <code>margin: 18px 5px 15px;</code></label>
                <input type="number" id="q4" name="q4">
            </fieldset>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
    <footer>
        <p>©2026 | HTML/CSS Quiz | Jerrymac Adams Oluoch</p>
    </footer>
</body>

</html>
